name: Build Jare Ooday APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev cmake \
            libffi-dev libssl-dev

      - name: Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ""
        run: |
          buildozer android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Jare-Ooday-APK
          path: bin/*.apk
